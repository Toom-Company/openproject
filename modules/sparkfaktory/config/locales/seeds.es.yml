            # Documentación del proyecto

            Usa esta wiki para procedimientos, decisiones y normas internas del proyecto.

            ## Páginas sugeridas

            * Objetivos y alcance
            * Acuerdos de trabajo
            * Procedimientos y listas de comprobación
            * Registro de decisiones
