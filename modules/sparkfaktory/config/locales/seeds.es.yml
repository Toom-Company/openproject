      welcome:
        title: "Bienvenido a Sparkfaktory Proyectos"
        text: |
          Organiza proyectos, equipos, tareas y reuniones en un solo lugar.

          * **Mis tareas** agrupa tu trabajo de todos los proyectos.
          * Cada proyecto tiene lista de tareas, tablero Kanban, reuniones y su propia documentación.
          * Empieza los proyectos nuevos desde la plantilla «Plantilla: proyecto estándar».
