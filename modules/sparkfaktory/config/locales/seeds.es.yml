          name: "Plantilla: proyecto estándar"
          status_explanation: Copia esta plantilla para empezar un proyecto con el tablero, las vistas y la documentación ya preparados.
          description: |
            Plantilla reutilizable. Crea proyectos nuevos desde «Nuevo proyecto» > «Usar plantilla».
          queries:
            item_0:
              name: Tareas abiertas
            item_1:
              name: Hitos
