                  text: |
                    ¡Nos alegra que te hayas unido! Te sugerimos probar algunas cosas para empezar en OpenProject.

                    _Prueba los siguientes pasos:_[Backlogs]. *Invitar nuevos miembros a tu proyecto*: &rightarrow; Ir a [Members]({{opSetting:base_url}}/projects/your-scrum-project/members) en la navegación del proyecto.
                    2. *Ver el registro de tu producto y los backlogs de Sprint*: &rightarrow; Ir a [Backlogs]({{opSetting:base_url}}/projects/your-scrum-project/backlogs) en la navegación del proyecto.
                    3. *Ver el tablero de tareas*: &rightarrow; Ir a [Backlogs] ({{opSetting:base_url}}/projects/your-scrum-project/backlogs) &rightarrow; Haga clic en la flecha derecha en Sprint &rightarrow; Seleccione [Task Board](##sprint:scrum_project__version__sprint_1).
                    4. *Crear un nueva tarea*: &rightarrow; Ir a [Tareas &rightarrow; Crear]({{opSetting:base_url}}/projects/your-scrum-project/work_packages/new).
                    5. *Crear y actualizar un plan de proyecto*: &rightarrow; Ir a [Plan del proyecto](##query:scrum_project__query__project_plan) en la navegación del proyecto.
                    6. *Crea un wiki de Sprint*: &rightarrow; Ir a [Backlogs]({{opSetting:base_url}}/projects/your-scrum-project/backlogs) y abre el wiki de sprint desde el menú desplegable derecho en un sprint. Puedes editar la [wiki template]({{opSetting:base_url}}/projects/your-scrum-project/wiki/) en función de tus necesidades.
                    7. *Activar más módulos*: &rightarrow; Ir a [Configuración del proyecto &rightarrow; Módulos]({{opSetting:base_url}}/projects/your-scrum-project/settings/modules).

                    Aquí encontrarás nuestras [Guías de usuario](https://www. penproject.org/docs/user-guide/).
